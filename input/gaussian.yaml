likelihood:
  wrapper: cobaya
  input: input/cobaya/gaussian_planck.yaml

data:
  n_samples: 5000
  n_sigma: 10.0
  n_augment: 2500
  n_neighbors: 20
  target_temperature: 7.0

model:
  n_layers: 5
  n_neurons: 512
  activation: alsing

training:
  n_epochs: 5000
  batch_size: 128
  loss: msre
  kappa_sigma: 3
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250

sampling:
  sampler: ensemble
  temperature: 7.0
  n_walkers: 64
  max_steps: 100000
  burn_in: 5000
  target_ess: null
  tau_stability: null
  chunk_size: 5000
  iat_memory_mb: 256

convergence:
  metric: marginal_r_minus_one
  threshold: 0.01
  max_iterations: 20
    